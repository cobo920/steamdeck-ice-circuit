<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" xml:space="preserve">
  <title>Ice Circuit background artwork</title>
  <desc>Original abstract circuit artwork with plain device text and no operating system logos.</desc>
  <defs>
    <linearGradient id="aBg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#0b1019" />
      <stop offset=".52" stop-color="#080b10" />
      <stop offset="1" stop-color="#0e1823" />
    </linearGradient>
    <linearGradient id="neon">
      <stop stop-color="#c4e4f7" />
      <stop offset=".58" stop-color="#a2c8e0" />
      <stop offset="1" stop-color="#7b9eb7" />
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4d7087" stop-opacity=".16" />
      <stop offset="1" stop-color="#101923" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridA" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#577183" stroke-width=".6" opacity=".035" />
    </pattern>
  </defs>
  <g id="background">
    <rect width="1280" height="800" fill="url(#aBg)" />
    <rect width="1280" height="800" fill="url(#gridA)" />
    <ellipse cx="270" cy="406" rx="440" ry="390" fill="url(#halo)" />
  </g>
  <g id="header">
    <line x1="48" y1="76" x2="1232" y2="76" stroke="#375061" stroke-width="1" opacity="0.45" />
    <text x="48" y="49" fill="#a9bdcc" font-family="DejaVu Sans Mono" font-size="17" font-weight="500" letter-spacing="2">STEAM DECK</text>
    <text x="1232" y="49" fill="#8197a8" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" letter-spacing="1" text-anchor="end">DUAL BOOT</text>
  </g>
  <g id="menu-heading">
    <text x="48" y="163" fill="#e4edf6" font-family="DejaVu Sans" font-size="39" font-weight="500" letter-spacing="1">TOOLS &amp; RECOVERY</text>
    <text x="48" y="198" fill="#889eaf" font-family="DejaVu Sans" font-size="18" font-weight="400" letter-spacing="0">More ways to boot. Always within reach.</text>
  </g>
  <g id="slogan">
    <text x="48" y="716" fill="#9cafbd" font-family="DejaVu Sans Mono" font-size="17" font-weight="500" letter-spacing="1.5" text-anchor="start">BUILT TO PLAY.</text>
    <text x="48" y="744" fill="#9cafbd" font-family="DejaVu Sans Mono" font-size="17" font-weight="500" letter-spacing="1.5" text-anchor="start">FREE TO EXPLORE.</text>
  </g>
  <g id="footer">
    <line x1="48" y1="677" x2="1232" y2="677" stroke="#2a3744" opacity=".65" />
    <text x="696" y="731" fill="#8fa5b6" font-family="DejaVu Sans Mono" font-size="16" letter-spacing=".6" xml:space="preserve">↑ ↓   SELECT     ENTER   BOOT     ESC   BACK</text>
  </g>
</svg>