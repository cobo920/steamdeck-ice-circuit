name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      # SHA/tag pairs verified against the official actions repositories.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional image test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes librsvg2-bin ffmpeg
      - name: Run isolated tests
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -v
      - name: Build audited ZIP and source archive
        run: python -B tools/package_release.py
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Retain downloadable test build
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ice-circuit-test-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
